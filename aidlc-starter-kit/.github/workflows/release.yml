name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'VERSION'
      - 'NEXT_VERSION'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/release.yml'

  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Update Version and Release Notes
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate RELEASE_PAT secret
        run: |
          if [ -z "${{ secrets.RELEASE_PAT }}" ]; then
            echo "::error::RELEASE_PAT secret is not set. This is required to push to protected branches."
            echo "Please add a PAT with 'repo' scope from a user in the bypass list as a repository secret named 'RELEASE_PAT'."
            exit 1
          fi
          echo "✅ RELEASE_PAT secret is configured"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "devopstexasgov"
          git config user.email "devopstexasgov@deloitte.com"
          # Ensure we're using the PAT for push operations
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}.git

      - name: Get current version
        id: current_version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '\n' | tr -d ' ')
          else
            VERSION="0.0.0"
          fi
          
          # Validate version format (must be X.Y.Z)
          if ! echo "$VERSION" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "::error::Invalid VERSION format: '$VERSION'. Expected format: X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Determine version bump type
        id: bump_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="${{ github.event.inputs.version_bump }}"
          else
            # Auto-detect from commit messages (use --format="%s" to get only message, not hash)
            COMMITS=$(git log --format="%s" $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD 2>/dev/null || git log --format="%s" -10)
            
            if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|!:"; then
              BUMP_TYPE="major"
            elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi
          echo "type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Version bump type: $BUMP_TYPE"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"

          # Always compute the auto-incremented version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          SUGGESTED="${MAJOR}.${MINOR}.${PATCH}"
          echo "suggested=$SUGGESTED" >> $GITHUB_OUTPUT
          echo "Auto-incremented version ($BUMP_TYPE bump): $SUGGESTED"

          # Check if NEXT_VERSION file contains an override
          NEXT=""
          if [ -f NEXT_VERSION ]; then
            NEXT=$(cat NEXT_VERSION | tr -d '\n' | tr -d ' ')
          fi

          if [ -n "$NEXT" ]; then
            # Strip leading 'v' if present
            NEXT="${NEXT#v}"

            if ! echo "$NEXT" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
              echo "::error::Invalid NEXT_VERSION format: '$NEXT'. Expected X.Y.Z (e.g., 2.1.0)"
              exit 1
            fi

            # NEXT_VERSION must be greater than the auto-incremented version
            IFS='.' read -r N_MAJ N_MIN N_PAT <<< "$NEXT"
            IFS='.' read -r S_MAJ S_MIN S_PAT <<< "$SUGGESTED"
            NEXT_NUM=$((N_MAJ * 10000 + N_MIN * 100 + N_PAT))
            SUGGESTED_NUM=$((S_MAJ * 10000 + S_MIN * 100 + S_PAT))

            if [ "$NEXT_NUM" -le "$SUGGESTED_NUM" ]; then
              echo "::warning::NEXT_VERSION ($NEXT) is not greater than auto-incremented version ($SUGGESTED). Ignoring NEXT_VERSION."
              NEW_VERSION="$SUGGESTED"
              echo "source=auto" >> $GITHUB_OUTPUT
            else
              echo "NEXT_VERSION ($NEXT) is greater than auto-incremented ($SUGGESTED). Using NEXT_VERSION."
              NEW_VERSION="$NEXT"
              echo "source=NEXT_VERSION" >> $GITHUB_OUTPUT
            fi
          else
            echo "NEXT_VERSION is empty or missing. Using auto-incremented: $SUGGESTED"
            NEW_VERSION="$SUGGESTED"
            echo "source=auto" >> $GITHUB_OUTPUT
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Generate release notes
        id: release_notes
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          TODAY=$(date +%Y-%m-%d)
          
          # Get commits since last tag or last 50 commits
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|%h|%an" "$LAST_TAG"..HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s|%h|%an" -50)
          fi
          
          # Categorize commits
          ADDED=""
          CHANGED=""
          FIXED=""
          DOCS=""
          OTHER=""
          
          while IFS='|' read -r MSG HASH AUTHOR; do
            [ -z "$MSG" ] && continue
            
            # Skip release commits
            if echo "$MSG" | grep -qiE "^(chore|release|bump).*version"; then
              continue
            fi
            
            # Skip merge commits
            if echo "$MSG" | grep -qiE "^Merge (pull request|branch)"; then
              continue
            fi
            
            ENTRY="- ${MSG} (\`${HASH}\`)"
            
            if echo "$MSG" | grep -qiE "^feat(\(.+\))?:"; then
              ADDED="${ADDED}${ENTRY}\n"
            elif echo "$MSG" | grep -qiE "^fix(\(.+\))?:"; then
              FIXED="${FIXED}${ENTRY}\n"
            elif echo "$MSG" | grep -qiE "^docs(\(.+\))?:"; then
              DOCS="${DOCS}${ENTRY}\n"
            elif echo "$MSG" | grep -qiE "^(refactor|perf|style)(\(.+\))?:"; then
              CHANGED="${CHANGED}${ENTRY}\n"
            else
              OTHER="${OTHER}${ENTRY}\n"
            fi
          done <<< "$COMMITS"
          
          # Build release notes section
          NOTES="## [${NEW_VERSION}] - ${TODAY}\n"
          
          if [ -n "$ADDED" ]; then
            NOTES="${NOTES}\n### Added\n${ADDED}"
          fi
          
          if [ -n "$CHANGED" ]; then
            NOTES="${NOTES}\n### Changed\n${CHANGED}"
          fi
          
          if [ -n "$FIXED" ]; then
            NOTES="${NOTES}\n### Fixed\n${FIXED}"
          fi
          
          if [ -n "$DOCS" ]; then
            NOTES="${NOTES}\n### Documentation\n${DOCS}"
          fi
          
          if [ -n "$OTHER" ]; then
            NOTES="${NOTES}\n### Other\n${OTHER}"
          fi
          
          # Save to file for use in next step
          echo -e "$NOTES" > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Update VERSION file
        run: |
          echo "${{ steps.new_version.outputs.version }}" > VERSION

      - name: Update package.json version
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${NEW_VERSION}\"/" package.json

      - name: Update README version badge
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          sed -i "s|!\[Version\](https://img.shields.io/badge/version-[^)]*)|![Version](https://img.shields.io/badge/version-${NEW_VERSION}-blue)|" README.md

      - name: Update CHANGELOG.md
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          REPO="${{ github.repository }}"
          
          # Read new release notes
          RELEASE_NOTES=$(cat /tmp/release_notes.md)
          
          # Create a temp file with the new release notes for insertion
          echo "" > /tmp/new_section.md
          cat /tmp/release_notes.md >> /tmp/new_section.md
          echo "" >> /tmp/new_section.md
          
          # Find the line number of the first version section (## [X.Y.Z])
          FIRST_VERSION_LINE=$(grep -n "^## \[[0-9]" CHANGELOG.md | head -1 | cut -d: -f1)
          
          if [ -n "$FIRST_VERSION_LINE" ]; then
            # Insert new version section before the first existing version
            head -n $((FIRST_VERSION_LINE - 1)) CHANGELOG.md > CHANGELOG.tmp
            cat /tmp/new_section.md >> CHANGELOG.tmp
            tail -n +$FIRST_VERSION_LINE CHANGELOG.md >> CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            # No existing version sections, append to end (before links)
            LINKS_LINE=$(grep -n "^\[Unreleased\]:" CHANGELOG.md | head -1 | cut -d: -f1)
            if [ -n "$LINKS_LINE" ]; then
              head -n $((LINKS_LINE - 1)) CHANGELOG.md > CHANGELOG.tmp
              cat /tmp/new_section.md >> CHANGELOG.tmp
              tail -n +$LINKS_LINE CHANGELOG.md >> CHANGELOG.tmp
              mv CHANGELOG.tmp CHANGELOG.md
            fi
          fi
          
          # Update the Unreleased link and add new version link
          sed -i "s|\[Unreleased\]:.*|[Unreleased]: https://github.com/${REPO}/compare/v${NEW_VERSION}...HEAD|" CHANGELOG.md
          
          # Add new version link if it doesn't exist
          if ! grep -q "^\[${NEW_VERSION}\]:" CHANGELOG.md; then
            sed -i "/^\[Unreleased\]:/a [${NEW_VERSION}]: https://github.com/${REPO}/compare/v${CURRENT_VERSION}...v${NEW_VERSION}" CHANGELOG.md
          fi

      - name: Clear NEXT_VERSION
        run: |
          echo -n "" > NEXT_VERSION

      - name: Commit version update
        run: |
          git add VERSION NEXT_VERSION CHANGELOG.md README.md package.json
          git commit -m "chore(release): bump version to ${{ steps.new_version.outputs.version }}"
          git push origin master

      - name: Create Git tag
        run: |
          git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new_version.outputs.version }}
          name: Release v${{ steps.new_version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Summary
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Version | ${{ steps.current_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-Incremented | ${{ steps.new_version.outputs.suggested }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Released Version | ${{ steps.new_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Source | ${{ steps.new_version.outputs.source }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | ${{ steps.bump_type.outputs.type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | v${{ steps.new_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
          cat /tmp/release_notes.md >> $GITHUB_STEP_SUMMARY
