# Custom Color Scheme Template
# Copy this file to {project_root}/_bmad/_config/dashboard-colors.yaml
# and customize the colors for your organization.
#
# Keys map directly to CSS custom properties in dashboard-template.html.
# Derived values (e.g. --accent-glow, --green-dim) are auto-generated
# from the base colors by the dashboard workflow.

name: "custom"
description: "Custom color scheme — replace with your organization's colors"

colors:
  # Backgrounds (dark → light layering)
  --bg: "#0a0f1a"
  --surface: "#111827"
  --surface-2: "#1a2332"
  --border: "#243044"

  # Text
  --text: "#f0f2f5"
  --text-dim: "#c9cdd6"
  --text-muted: "#6b7a8d"

  # Primary accent (buttons, links, active highlights)
  --accent: "#86BC25"

  # Status colors (used for badges, charts, progress bars)
  --green: "#86BC25"       # done
  --yellow: "#FFD700"      # ready-for-dev
  --orange: "#FF8C00"      # attention/warnings
  --red: "#f87171"         # blockers/errors
  --blue: "#00A1DE"        # review
  --purple: "#9D4EDD"      # in-progress
  --cyan: "#00D4FF"        # secondary accent
