# Prompt Configuration for GitHub Copilot

# Tool Versions - Used by /tdgs-aidlc-setup-workspace for installation
# Update these when upgrading to new versions
versions:
  bmad: "6.3.0"

# Issue Tracking - Where GitHub issues are located for this project
# Format: owner/repo (leave empty to use current repository)
issues:
  repository: ""

# App-specific repos — owned by this application team
# Used by: all AIDLC prompts (branch, commit, PR, KB generation)
# Populated automatically by /tdgs-aidlc-setup-workspace from detected workspace repos
# KB output: knowledge-base/repos/{key}/
# Format: <service-key>: "<github-org>/<repo-name>"
worker_repos:

# Common/shared repos (Recommended) — used by multiple applications, symlinked into workspace
# Same format as worker_repos. Merged with worker_repos at runtime for all operations.
# KB output: knowledge-base/common-services/{key}/
# PRs: flagged with shared-code impact warning
# Specs: trigger Common Services Impact Assessment
# Format: <service-key>: "<github-org>/<repo-name>"
common_repos:
  # notificationengine-service: "<github-org>/<repo-name>"
  # pacs-service: "<github-org>/<repo-name>"
  # paymentintegration-service: "<github-org>/<repo-name>"

# Alternative: Remote sync via GitHub MCP (only when symlinks not possible)
# Used by: /tdgs-aidlc-reference-sync when repos cannot be symlinked into workspace
# KB output: knowledge-base/common-services/
# NOTE: Prefer common_repos above unless network/permission constraints prevent symlinks
common_services:
  # example-common-service: "<github-org>/<repo-name>"

# Knowledge Base Generation settings (optional)
# Used by: /tdgs-aidlc-generate-kb
# Auto-detection handles most cases; use this to override
kb_generation:
  # apigee: auto | git | exports | false
  #   auto (default): detects apigee-exports/ folder OR repos with apiproxy/ folder
  #   git: force git-based proxy repo detection (repos cloned into workspace)
  #   exports: force apigee-exports/ folder detection (manually exported bundles)
  #   false: disable Apigee documentation section entirely
  apigee: auto

  # apigee_folder: custom folder name for exports mode (default: "apigee-exports")
  # apigee_folder: "apigee-exports"

  # apigee_repos: explicit list of Apigee proxy repo names for git mode
  # If omitted, auto-detects repos containing apiproxy/ folder or matching *-proxy pattern
  # apigee_repos:
  #   - "tdgs-myapp-transaction-proxy"
  #   - "tdgs-myapp-utility-proxy"

